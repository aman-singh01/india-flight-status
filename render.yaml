# Render blueprint -- New > Blueprint, point at this repo.
# Free tier: no persistent disk (cache is ephemeral, adsbdb refetches on cold
# start) and the service sleeps after ~15 min idle.
services:
  - type: web
    name: india-flight-status
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SOURCES
        value: adsblol,adsbfi
      - key: POLL_INTERVAL
        value: "5"
      - key: STALE_TTL
        value: "150"
      # - key: SCHEDULE_PROVIDER
      #   value: aerodatabox
      # - key: SCHEDULE_API_KEY
      #   sync: false            # set in the Render dashboard, not in git
