# Render blueprint -- New > Blueprint, point at this repo.
# Free tier: no persistent disk (the live route cache is ephemeral, but the app
# ships a route seed so a cold start still knows ~1000 routes) and the service
# sleeps after ~15 min idle.
services:
  - type: web
    name: india-flight-status
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SOURCES
        value: adsblol,adsbfi,opensky
      - key: POLL_INTERVAL
        value: "5"
      - key: STALE_TTL
        value: "210"
      - key: FIDS_SOURCES
        value: del
      # - key: SCHEDULE_PROVIDER
      #   value: aerodatabox
      # - key: SCHEDULE_API_KEY
      #   sync: false            # set in the Render dashboard, not in git
