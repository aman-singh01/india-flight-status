<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>India Flight Status</title>
  <meta name="description" content="Live status board for domestic flights over India — route, phase, altitude, speed and (with a schedule key) scheduled times, gate and delay. From public ADS-B data." />
  <meta name="theme-color" content="#0a0c12" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="India Flight Status" />
  <meta property="og:description" content="Live status of every domestic flight over India, from public ADS-B data." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0c12'/%3E%3Cpath d='M16 4 L18 9 L18 15 L29 21 L29 23 L18 20 L18 26 L21 28 L21 29 L16 27.5 L11 29 L11 28 L14 26 L14 20 L3 23 L3 21 L14 15 L14 9 Z' fill='%2338bdf8'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://unpkg.com" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="style.css?v=13" rel="stylesheet" />
</head>
<body>
  <div id="toast" role="status" aria-live="polite"></div>
  <!-- ===== STATUS BOARD (default) ===== -->
  <section id="status-view" class="view">
    <div class="board">
      <header class="board-head">
        <div class="board-title">
          <span class="dot"></span> India Domestic Flights
          <span id="board-conn" class="board-conn">connecting…</span>
        </div>
        <div class="board-meta">
          <b id="board-count">0</b> flights ·
          <b id="board-air">0</b> airborne ·
          <span id="board-upd" class="muted">—</span>
        </div>
      </header>
      <div class="board-controls">
        <input id="board-filter" type="text" autocomplete="off" spellcheck="false"
               placeholder="Filter — flight no, airline, airport code, status…" />
        <select id="board-sort">
          <option value="status">Sort: status</option>
          <option value="flight">Sort: flight no</option>
          <option value="alt">Sort: altitude</option>
          <option value="airline">Sort: airline</option>
        </select>
      </div>
      <div id="board-list"></div>
    </div>
    <button class="view-switch" data-goto="map">Live map &rarr;</button>
  </section>

  <!-- ===== MAP VIEW (secondary) ===== -->
  <div id="map-view" class="view hidden">
    <div id="map"></div>

    <header id="topbar">
      <div class="brand"><span class="dot"></span> <strong>India Domestic</strong> Flight Tracker</div>
      <div id="counts">
        <span id="c-live">0</span> flights
        <span class="sep">·</span>
        <span id="c-air">0</span> airborne
        <span class="sep">·</span>
        <span id="c-status" class="muted">connecting…</span>
      </div>
    </header>

    <section id="filters">
      <label>
        Airline
        <select id="f-airline"><option value="">All airlines</option></select>
      </label>
      <label>
        Min altitude <span id="f-alt-val" class="mono">0 ft</span>
        <input id="f-alt" type="range" min="0" max="40000" step="1000" value="0" />
      </label>
      <label>
        Search
        <input id="f-search" type="text" placeholder="6E203, VT-…, callsign" autocomplete="off" />
      </label>
      <ul id="legend">
        <li><i style="background:#94a3b8"></i>&lt;3k</li>
        <li><i style="background:#f87171"></i>3k</li>
        <li><i style="background:#fb923c"></i>10k</li>
        <li><i style="background:#fbbf24"></i>20k</li>
        <li><i style="background:#4ade80"></i>30k</li>
        <li><i style="background:#38bdf8"></i>38k+</li>
      </ul>
    </section>

    <aside id="detail" class="hidden">
      <button id="detail-close" aria-label="close">×</button>
      <div id="detail-body"></div>
    </aside>

    <div id="basemap">
      <button data-style="dark" class="active">Dark</button>
      <button data-style="light">Light</button>
      <button data-style="satellite">Satellite</button>
    </div>

    <button id="pb-enter">&#9201; Playback</button>
    <div id="playback" class="hidden">
      <button id="pb-play" aria-label="play/pause">&#9654;</button>
      <input id="pb-slider" type="range" step="10" aria-label="time" />
      <div class="pb-info"><span id="pb-time" class="mono">&mdash;</span> &middot; <span id="pb-count">0</span> ac</div>
      <select id="pb-speed" aria-label="speed">
        <option value="60">60&times;</option>
        <option value="240" selected>240&times;</option>
        <option value="900">900&times;</option>
      </select>
      <button id="pb-exit">&larr; Live</button>
    </div>

    <button class="view-switch" data-goto="status">&larr; Flight status</button>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
