[tool.black]
line-length = 110
target-version = ["py311"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["backend"]
extend-exclude = [".venv", "backend/.venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# E501 -> black; B008 -> FastAPI Depends(); SIM105 -> try/except/pass is fine here
ignore = ["E501", "B008", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
